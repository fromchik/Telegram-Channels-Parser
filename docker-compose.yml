version: "3.9"

services:
  migrate:
    build: .
    env_file:
      - .env
    volumes:
      - bot_data:/app/data
    command: ["alembic", "upgrade", "head"]

  bot:
    build: .
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - bot_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import app.main; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  bot_data:
